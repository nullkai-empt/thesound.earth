[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherwaves"
version = "0.3.0"
description = "THESOUND.EARTH deterministic NASA satellite data sonification and voice navigation server"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aetherwaves*"]
