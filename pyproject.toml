[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherwaves"
version = "1.0.0"
description = "AetherWaves deterministic scientific sonification engine for NASA OSCAR ocean currents"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "scipy>=1.12",
    "soundfile>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-genai>=1.0",
    "opencv-python-headless>=4.9",
    "kokoro-onnx>=0.6",
    "onnxruntime>=1.20",
    "faster-whisper>=1.0",
]

[project.scripts]
aetherwaves = "aetherwaves.pipeline:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]